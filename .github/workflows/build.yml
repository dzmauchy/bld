name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
        env:
          # setup-node runs `npm config get cache`, which rejects workspaces=true
          npm_config_workspaces: false

      - name: Cache Puppeteer Chrome
        uses: actions/cache@v6
        with:
          path: ~/.cache/puppeteer
          key: ${{ runner.os }}-${{ runner.arch }}-puppeteer-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome system dependencies
        run: sudo --preserve-env=PUPPETEER_CACHE_DIR node node_modules/puppeteer/lib/puppeteer/node/cli.js browsers install chrome --install-deps
        env:
          PUPPETEER_CACHE_DIR: /home/runner/.cache/puppeteer

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

