name: CLANG and LLD and SYSROOT

on:
  workflow_dispatch:
    inputs:
      llvm_ref:
        description: 'LLVM branch or tag to checkout'
        required: true
        default: 'release/23.x'
      release_tag:
        description: 'Release tag name (for manual runs)'
        required: true
        default: 'clang-lld-23-wasm-latest'

permissions:
  contents: write

jobs:
  build-wasm:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Configure Swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 13G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake python3 clang lld nodejs

      - name: Setup emsdk
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.9
          emsdk-version: 6.0.9

      - name: Checkout LLVM Monorepo
        uses: actions/checkout@v7
        with:
          repository: llvm/llvm-project
          ref: ${{ github.event.inputs.llvm_ref || 'release/23.x' }}
          fetch-depth: 1
          path: llvm-project

      - name: Run JS Build Script
        run: node .github/scripts/clang-builder.mjs

      - name: Publish Artifacts to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/clang.wasm
            dist/clang.js
            dist/lld.wasm
            dist/lld.js
            dist/sysroot.tgz