name: Build and Release Clang and LLD WASM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      llvm_ref:
        description: 'LLVM branch or tag to checkout'
        required: true
        default: 'release/23.x'
      release_tag:
        description: 'Release tag name (for manual runs)'
        required: false
        default: 'clang-lld-23-wasm-latest'

permissions:
  contents: write

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Free Disk Space with apt-get & Configure Swap
        run: |
          sudo apt-get update
          sudo apt-get remove --purge -y \
            azure-cli \
            google-cloud-cli \
            google-chrome-stable \
            firefox \
            powershell \
            "dotnet-*" \
            "aspnetcore-*" \
            "mono-*" \
            "php*" \
            "mysql-*" \
            "postgresql-*"
          sudo apt-get autoremove --purge -y
          sudo apt-get clean

          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc "$AGENT_TOOLSDIRECTORY" || true

          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 13G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          df -h
          swapon --show

      - name: Install System Dependencies (with LLD and Clang)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            cmake \
            brotli \
            python3 \
            clang \
            lld

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Checkout LLVM Monorepo
        uses: actions/checkout@v7
        with:
          repository: llvm/llvm-project
          ref: ${{ github.event.inputs.llvm_ref || 'release/23.x' }}
          fetch-depth: 1
          path: llvm-project

      - name: Stage 1 - Build Native TableGen Tools (Using LLD)
        run: |
          cd llvm-project
          cmake -G Ninja -B build-native -S llvm \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang" \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DLLVM_USE_LINKER=lld \
            -DLLVM_ENABLE_BINDINGS=OFF

          export NINJA_STATUS="[%f/%t %e] "
          ninja -C build-native -j 2 llvm-tblgen clang-tblgen llvm-min-tblgen || ninja -C build-native -j 2 llvm-tblgen clang-tblgen

      - name: Stage 2 - Build Clang and LLD to WebAssembly
        run: |
          cd llvm-project
          NATIVE_BIN="$(pwd)/build-native/bin"

          # 1. Enabled projects: "clang;lld"
          # 2. Changed EXPORT_NAME to generic 'createModule' so ES6 imports work seamlessly for both
          emcmake cmake -G Ninja -B build-wasm -S llvm \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD="WebAssembly" \
            -DLLVM_DEFAULT_TARGET_TRIPLE="wasm32-unknown-emscripten" \
            -DLLVM_NATIVE_TOOL_DIR="$NATIVE_BIN" \
            -DLLVM_ENABLE_THREADS=OFF \
            -DLLVM_ENABLE_BACKTRACES=OFF \
            -DLLVM_ENABLE_CRASH_OVERRIDES=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_PLUGINS=OFF \
            -DLLVM_ENABLE_BINDINGS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_BUILD_UTILS=OFF \
            -DCLANG_ENABLE_STATIC_ANALYZER=OFF \
            -DCLANG_ENABLE_OBJC_REWRITER=OFF \
            -DCLANG_TOOL_C_INDEX_TEST_BUILD=OFF \
            -DCLANG_ENABLE_HLSL=OFF \
            -DCLANG_BUILD_TOOLS=ON \
            -DCMAKE_CXX_FLAGS="-Os -ffunction-sections -fdata-sections -fno-exceptions -fno-rtti -mbulk-memory -mextended-const -mtail-call -mmultivalue -msign-ext -mnontrapping-fptoint -mreference-types" \
            -DCMAKE_EXE_LINKER_FLAGS="-Os -Wl,--gc-sections -mbulk-memory -mextended-const -mtail-call -mmultivalue -msign-ext -mnontrapping-fptoint -mreference-types -sMALLOC=emmalloc -sEVAL_CTORS=1 -sALLOW_MEMORY_GROWTH=1 -sINITIAL_MEMORY=256MB -sMAXIMUM_MEMORY=2GB -sFORCE_FILESYSTEM=1 -sDISABLE_EXCEPTION_CATCHING=1 -sWASM_BIGINT=1 -sTEXTDECODER=2 -sEXPORTED_RUNTIME_METHODS=FS,callMain -sEXPORT_NAME=createModule -sMODULARIZE=1 -sEXPORT_ES6=1"
          
          export NINJA_STATUS="[%f/%t %e] "
          ninja -C build-wasm -j 2 clang lld

      - name: Stage 3 - Optimize with Binaryen and Compress Both Binaries
        run: |
          mkdir -p dist
          SRC_DIR="llvm-project/build-wasm/bin"

          for tool in clang lld; do
            if [ ! -f "$SRC_DIR/$tool.wasm" ]; then
              echo "Error: $SRC_DIR/$tool.wasm not found!"
              ls -la "$SRC_DIR" || true
              exit 1
            fi
          done

          WASM_OPT="${EMSDK}/upstream/bin/wasm-opt"
          if [ ! -x "$WASM_OPT" ]; then
            echo "Error: wasm-opt not found at $WASM_OPT"
            exit 1
          fi

          # Optimize both wasm binaries
          for tool in clang lld; do
            echo "Optimizing $tool.wasm with wasm-opt..."
            "$WASM_OPT" -Oz --converge --strip-debug --strip-producers --strip-target-features --reorder-functions -all "$SRC_DIR/$tool.wasm" -o "dist/$tool.wasm"
            cp "$SRC_DIR/$tool.js" "dist/$tool.js"
          done

      - name: Determine Release Tag
        id: release_meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi
          echo "timestamp=$(date -u +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT

      - name: Publish Artifacts to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: "clang-${{ steps.release_meta.outputs.tag }}-${{ steps.release_meta.outputs.timestamp }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/clang.wasm
            dist/clang.js
            dist/lld.wasm
            dist/lld.js