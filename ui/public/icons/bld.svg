<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#161f30"/>
      <stop offset="55%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#04060a"/>
    </radialGradient>

    <!-- Builder Steel Gradients -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="darkGirder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#192231"/>
    </linearGradient>

    <!-- Boludo Spherical Gold Gradient -->
    <radialGradient id="sphereGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="sphereShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background Plate (Squircle App Icon Base) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="506" height="506" x="3" y="3" rx="109" fill="none" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="2"/>

  <!-- Blueprint CAD Grid Lines -->
  <g stroke="#38bdf8" stroke-opacity="0.07" stroke-width="1" stroke-dasharray="6 6">
    <line x1="40" y1="80" x2="472" y2="80"/>
    <line x1="40" y1="168" x2="472" y2="168"/>
    <line x1="40" y1="256" x2="472" y2="256"/>
    <line x1="40" y1="344" x2="472" y2="344"/>
    <line x1="40" y1="432" x2="472" y2="432"/>
    <line x1="86" y1="40" x2="86" y2="472"/>
    <line x1="238" y1="40" x2="238" y2="472"/>
    <line x1="350" y1="40" x2="350" y2="472"/>
  </g>

  <!-- CAD Dimension Corner Ticks -->
  <path d="M 52,68 L 52,52 L 68,52 M 460,68 L 460,52 L 444,52 M 52,444 L 52,460 L 68,460 M 460,444 L 460,460 L 444,460" 
        fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2"/>

  <!-- ==================== LETTER: B ==================== -->
  <!-- Scaled vertical span: y=80 to y=432 (352px height) -->
  <g id="letter-B">
    <!-- Vertical I-Beam Column -->
    <rect x="46" y="80" width="42" height="352" rx="8" fill="url(#beamGrad)" filter="url(#cyanGlow)"/>
    <line x1="67" y1="92" x2="67" y2="420" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="10 8"/>

    <!-- Top Boludo Orb (B's Upper Loop) -->
    <circle cx="146" cy="168" r="66" fill="url(#sphereGrad)" filter="url(#sphereShadow)"/>
    <circle cx="146" cy="168" r="30" fill="#0b0f17"/>
    <circle cx="146" cy="168" r="30" fill="none" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="2.5"/>

    <!-- Bottom Boludo Orb (B's Lower Loop - Grounded & Larger) -->
    <circle cx="154" cy="334" r="76" fill="url(#sphereGrad)" filter="url(#sphereShadow)"/>
    <circle cx="154" cy="334" r="36" fill="#0b0f17"/>
    <circle cx="154" cy="334" r="36" fill="none" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="2.5"/>

    <!-- Heavy Steel Rivets -->
    <circle cx="67" cy="98" r="4.5" fill="#f8fafc"/>
    <circle cx="67" cy="414" r="4.5" fill="#f8fafc"/>
  </g>

  <!-- ==================== LETTER: L ==================== -->
  <!-- Scaled Structural Angle Girder + Rigidity Brace -->
  <g id="letter-L">
    <!-- L Girder Path -->
    <path d="M 238,80 L 280,80 L 280,388 L 338,388 L 338,432 L 238,432 Z" 
          fill="url(#beamGrad)" filter="url(#cyanGlow)"/>
    
    <!-- Internal 45° Truss / Scaffolding Brace -->
    <line x1="280" y1="324" x2="328" y2="388" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Calibration Measurement Ticks along L Base -->
    <line x1="250" y1="432" x2="250" y2="418" stroke="#042f2e" stroke-width="2.5"/>
    <line x1="268" y1="432" x2="268" y2="422" stroke="#042f2e" stroke-width="2.5"/>
    <line x1="286" y1="432" x2="286" y2="418" stroke="#042f2e" stroke-width="2.5"/>
    <line x1="304" y1="432" x2="304" y2="422" stroke="#042f2e" stroke-width="2.5"/>
    <line x1="322" y1="432" x2="322" y2="418" stroke="#042f2e" stroke-width="2.5"/>

    <!-- Fasteners -->
    <circle cx="259" cy="98" r="4.5" fill="#f8fafc"/>
    <circle cx="259" cy="412" r="4.5" fill="#f8fafc"/>
    <circle cx="320" cy="412" r="4.5" fill="#f8fafc"/>
  </g>

  <!-- ==================== LETTER: D ==================== -->
  <!-- Heavy Architectural Arch + Center Counterweight Sphere -->
  Add<g id="letter-D">
    <!-- Outer D Shell -->
    <path d="M 350,80 L 400,80 C 472,80 478,140 478,256 C 478,372 472,432 400,432 L 350,432 Z" 
          fill="url(#darkGirder)" stroke="url(#beamGrad)" stroke-width="8"/>

    <!-- Inner Negative Space Cutout -->
    <path d="M 388,124 L 398,124 C 438,124 442,168 442,256 C 442,344 438,388 398,388 L 388,388 Z" 
          fill="#0a0e17"/>

    <!-- Center Floating Boludo Sphere (Balanced Core) -->
    <circle cx="408" cy="256" r="38" fill="url(#sphereGrad)" filter="url(#sphereShadow)"/>
    <circle cx="408" cy="256" r="12" fill="#fef08a" opacity="0.65"/>

    <!-- Vertical Anchor Flange & Rivet Column -->
    <rect x="345" y="80" width="10" height="352" rx="3" fill="#38bdf8"/>
    <circle cx="350" cy="98" r="4" fill="#f8fafc"/>
    <circle cx="350" cy="256" r="4" fill="#f8fafc"/>
    <circle cx="350" cy="414" r="4" fill="#f8fafc"/>
  </g>
</svg>
