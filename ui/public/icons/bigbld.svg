<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Background Radial Gradients -->
    <radialGradient id="cardBg" cx="35%" cy="35%" r="90%">
      <stop offset="0%" stop-color="#141d2d"/>
      <stop offset="50%" stop-color="#090d15"/>
      <stop offset="100%" stop-color="#020407"/>
    </radialGradient>

    <radialGradient id="bgGrad" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#161f30"/>
      <stop offset="55%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#04060a"/>
    </radialGradient>

    <!-- Builder Steel Gradients -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="textBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="darkGirder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#192231"/>
    </linearGradient>

    <linearGradient id="cardPlateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182335"/>
      <stop offset="100%" stop-color="#0c121d"/>
    </linearGradient>

    <!-- Boludo Spherical Gold Gradient -->
    <radialGradient id="sphereGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>

    <!-- CAD Grid Patterns -->
    <pattern id="cadGridMinor" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.04"/>
    </pattern>

    <pattern id="cadGridMajor" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="url(#cadGridMinor)"/>
      <path d="M 120 0 L 0 0 0 120" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.08" stroke-dasharray="6 4"/>
      <circle cx="120" cy="120" r="1.5" fill="#38bdf8" fill-opacity="0.2"/>
    </pattern>

    <!-- Glow & Shadow Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="sphereShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <filter id="iconElevation" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="4" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.2"/>
    </filter>

    <filter id="itemShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, Menlo, monospace; }
    .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Inter, 'Helvetica Neue', sans-serif; }
  </style>

  <!-- ==================== BANNER BACKGROUND ==================== -->
  <rect width="1280" height="640" fill="url(#cardBg)"/>
  <rect width="1280" height="640" fill="url(#cadGridMajor)"/>

  <!-- Clean Outer Frame -->
  <rect x="24" y="24" width="1232" height="592" rx="20" fill="none" stroke="#38bdf8" stroke-opacity="0.14" stroke-width="1.5"/>

  <!-- ==================== LEFT: APP ICON ==================== -->
  <g id="preview-app-icon" transform="translate(68, 64)" filter="url(#iconElevation)">
    <!-- Background Plate (Squircle App Icon Base) -->
    <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
    <rect width="506" height="506" x="3" y="3" rx="109" fill="none" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="2"/>

    <!-- Blueprint CAD Grid Lines -->
    <g stroke="#38bdf8" stroke-opacity="0.07" stroke-width="1" stroke-dasharray="6 6">
      <line x1="40" y1="80" x2="472" y2="80"/>
      <line x1="40" y1="168" x2="472" y2="168"/>
      <line x1="40" y1="256" x2="472" y2="256"/>
      <line x1="40" y1="344" x2="472" y2="344"/>
      <line x1="40" y1="432" x2="472" y2="432"/>
      <line x1="86" y1="40" x2="86" y2="472"/>
      <line x1="238" y1="40" x2="238" y2="472"/>
      <line x1="350" y1="40" x2="350" y2="472"/>
    </g>

    <!-- CAD Dimension Corner Ticks -->
    <path d="M 52,68 L 52,52 L 68,52 M 460,68 L 460,52 L 444,52 M 52,444 L 52,460 L 68,460 M 460,444 L 460,460 L 444,460" 
          fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2"/>

    <!-- ==================== LETTER: B ==================== -->
    <g id="letter-B">
      <rect x="46" y="80" width="42" height="352" rx="8" fill="url(#beamGrad)" filter="url(#cyanGlow)"/>
      <line x1="67" y1="92" x2="67" y2="420" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="10 8"/>

      <circle cx="146" cy="168" r="66" fill="url(#sphereGrad)" filter="url(#sphereShadow)"/>
      <circle cx="146" cy="168" r="30" fill="#0b0f17"/>
      <circle cx="146" cy="168" r="30" fill="none" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="2.5"/>

      <circle cx="154" cy="334" r="76" fill="url(#sphereGrad)" filter="url(#sphereShadow)"/>
      <circle cx="154" cy="334" r="36" fill="#0b0f17"/>
      <circle cx="154" cy="334" r="36" fill="none" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="2.5"/>

      <circle cx="67" cy="98" r="4.5" fill="#f8fafc"/>
      <circle cx="67" cy="414" r="4.5" fill="#f8fafc"/>
    </g>

    <!-- ==================== LETTER: L ==================== -->
    <g id="letter-L">
      <path d="M 238,80 L 280,80 L 280,388 L 338,388 L 338,432 L 238,432 Z" 
            fill="url(#beamGrad)" filter="url(#cyanGlow)"/>
      
      <line x1="280" y1="324" x2="328" y2="388" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
      
      <line x1="250" y1="432" x2="250" y2="418" stroke="#042f2e" stroke-width="2.5"/>
      <line x1="268" y1="432" x2="268" y2="422" stroke="#042f2e" stroke-width="2.5"/>
      <line x1="286" y1="432" x2="286" y2="418" stroke="#042f2e" stroke-width="2.5"/>
      <line x1="304" y1="432" x2="304" y2="422" stroke="#042f2e" stroke-width="2.5"/>
      <line x1="322" y1="432" x2="322" y2="418" stroke="#042f2e" stroke-width="2.5"/>

      <circle cx="259" cy="98" r="4.5" fill="#f8fafc"/>
      <circle cx="259" cy="412" r="4.5" fill="#f8fafc"/>
      <circle cx="320" cy="412" r="4.5" fill="#f8fafc"/>
    </g>

    <!-- ==================== LETTER: D ==================== -->
    <g id="letter-D">
      <path d="M 350,80 L 400,80 C 472,80 478,140 478,256 C 478,372 472,432 400,432 L 350,432 Z" 
            fill="url(#darkGirder)" stroke="url(#beamGrad)" stroke-width="8"/>

      <path d="M 388,124 L 398,124 C 438,124 442,168 442,256 C 442,344 438,388 398,388 L 388,388 Z" 
            fill="#0a0e17"/>

      <circle cx="408" cy="256" r="38" fill="url(#sphereGrad)" filter="url(#sphereShadow)"/>
      <circle cx="408" cy="256" r="12" fill="#fef08a" opacity="0.65"/>

      <rect x="345" y="80" width="10" height="352" rx="3" fill="#38bdf8"/>
      <circle cx="350" cy="98" r="4" fill="#f8fafc"/>
      <circle cx="350" cy="256" r="4" fill="#f8fafc"/>
      <circle cx="350" cy="414" r="4" fill="#f8fafc"/>
    </g>
  </g>

  <!-- Clean Vertical Divider Line -->
  <line x1="616" y1="84" x2="616" y2="556" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- ==================== RIGHT: TYPOGRAPHY & FEATURES ==================== -->
  <!-- Main Title: A visual programming IDE -->
  <g transform="translate(654, 134)">
    <text class="sans" x="0" y="0" font-size="36" font-weight="600" fill="#94a3b8" letter-spacing="0.2">A visual</text>
    <text class="sans" x="0" y="58" font-size="56" font-weight="800" fill="url(#textBeamGrad)" filter="url(#softGlow)" letter-spacing="-0.5">programming IDE</text>
  </g>

  <!-- Section Divider -->
  <line x1="654" y1="232" x2="1208" y2="232" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- FEATURE LIST -->
  <!-- Item 1: WASM generation -->
  <g transform="translate(654, 266)" filter="url(#itemShadow)">
    <rect width="554" height="74" rx="14" fill="url(#cardPlateGrad)" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.5"/>
    <line x1="0" y1="37" x2="8" y2="37" stroke="#38bdf8" stroke-width="3"/>
    
    <!-- Indicator: Boludo Gold Orb -->
    <circle cx="44" cy="37" r="14" fill="url(#sphereGrad)" filter="url(#sphereShadow)"/>
    <circle cx="44" cy="37" r="6" fill="#0b0f17"/>
    <circle cx="44" cy="37" r="6" fill="none" stroke="#fef08a" stroke-opacity="0.6" stroke-width="1.5"/>

    <!-- Bullet Text -->
    <text class="sans" x="78" y="46" font-size="25">
      <tspan fill="#38bdf8" font-weight="700" font-family="'JetBrains Mono', monospace">- </tspan>
      <tspan fill="#ffffff" font-weight="800">WASM </tspan>
      <tspan fill="#cbd5e1" font-weight="600">generation</tspan>
    </text>

    <!-- Accent Rivet -->
    <circle cx="530" cy="37" r="3.5" fill="#f8fafc" opacity="0.5"/>
  </g>

  <!-- Item 2: full in-browser simulation -->
  <g transform="translate(654, 364)" filter="url(#itemShadow)">
    <rect width="554" height="74" rx="14" fill="url(#cardPlateGrad)" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.5"/>
    <line x1="0" y1="37" x2="8" y2="37" stroke="#38bdf8" stroke-width="3"/>

    <!-- Indicator: Cyan Steel Girder Node -->
    <rect x="30" y="23" width="28" height="28" rx="8" fill="url(#beamGrad)" filter="url(#softGlow)"/>
    <circle cx="44" cy="37" r="6" fill="#0b0f17"/>
    <circle cx="44" cy="37" r="2.5" fill="#ffffff"/>

    <!-- Bullet Text -->
    <text class="sans" x="78" y="46" font-size="25">
      <tspan fill="#38bdf8" font-weight="700" font-family="'JetBrains Mono', monospace">- </tspan>
      <tspan fill="#cbd5e1" font-weight="600">full </tspan>
      <tspan fill="#ffffff" font-weight="800">in-browser simulation</tspan>
    </text>

    <!-- Accent Rivet -->
    <circle cx="530" cy="37" r="3.5" fill="#f8fafc" opacity="0.5"/>
  </g>

  <!-- Item 3: design-time error checking -->
  <g transform="translate(654, 462)" filter="url(#itemShadow)">
    <rect width="554" height="74" rx="14" fill="url(#cardPlateGrad)" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.5"/>
    <line x1="0" y1="37" x2="8" y2="37" stroke="#38bdf8" stroke-width="3"/>

    <!-- Indicator: Precision Calibration Node -->
    <circle cx="44" cy="37" r="14" fill="url(#darkGirder)" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="44" cy="37" r="6" fill="url(#sphereGrad)"/>
    <line x1="30" y1="37" x2="58" y2="37" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1"/>
    <line x1="44" y1="23" x2="44" y2="51" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1"/>

    <!-- Bullet Text -->
    <text class="sans" x="78" y="46" font-size="25">
      <tspan fill="#38bdf8" font-weight="700" font-family="'JetBrains Mono', monospace">- </tspan>
      <tspan fill="#cbd5e1" font-weight="600">design-time </tspan>
      <tspan fill="#ffffff" font-weight="800">error checking</tspan>
    </text>

    <!-- Accent Rivet -->
    <circle cx="530" cy="37" r="3.5" fill="#f8fafc" opacity="0.5"/>
  </g>
</svg>
